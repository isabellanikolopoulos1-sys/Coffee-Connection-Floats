<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> CSS Box Model </title>
    <style> 

    h1, h2 {
         
        text-align: center;
    }

    section {
       width: 450px;
       margin: 25px auto;
       padding: 20px;
       border: 2px solid black;
      
    }
   </style> 
</head>
</body>


<header>
    <h1>CSS Box Model Demonstration</h1>
</header>

<section>
  <h2> This is box 1</h2>
  <h2> There is content here.</h2>
</section>

<section>
<h2> This is box 2</h2>
<p> There is content here as well.</p>
</section>

</body>
</html>
